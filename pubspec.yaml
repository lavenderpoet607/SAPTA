name: absensi
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  google_maps_flutter: ^2.18.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/images/app_logo_background.png"
  adaptive_icon_foreground: "assets/images/app_logo_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
